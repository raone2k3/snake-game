<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Eat Snake Eat</title>
  </head>
  <body>
    <main>
      <section>
        <div class="infos">
          <div class="info">
            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>
            <h3>High Score: <span id="high-score">0</span></h3>
            <div class="ticks"><span></span><span></span></div>
          </div>
          <div class="info">
            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>
            <h3>Score: <span id="current-score">0</span></h3>
            <div class="ticks"><span></span><span></span></div>
          </div>
          <div class="info">
            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>
            <h3>Time: <span id="time">00:00</span></h3>
            <div class="ticks"><span></span><span></span></div>
          </div>
        </div>
        <div class="board">
        </div>
      </section>
      <div class="modal">
        <div class="start-game">
          <h3>Welcome to Eat Snake Eat!</h3>
          <button class="btn start-btn">Start Game</button>
        </div>
        <div class="game-over">
          <h3>Game Over!</h3>
          <button class="btn restart-btn">Restart Game</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
